[project]
name = "tts-lab"
version = "0.1.0"
description = "Web-UI zum Vergleichen lokaler Voice-Cloning-Modelle"
authors = [
    { name = "Benedikt Engeser", email = "be@418tp.net" }
]
requires-python = ">=3.11"
dependencies = [
    "gradio>=6.8.0",
    "mlx-audio>=0.5.5",
    "mlx-whisper>=0.4.3",
    "numpy>=1.26.4",
    "soundfile>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ttslab"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: braucht echte Modelle (Download, Minuten)"]
